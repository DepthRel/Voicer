<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-labelledby="title desc">
  <title id="title">Voicer</title>
  <desc id="desc">Voicer: speech to text and text to speech on your own computer. A sound wave beats like a heart.</desc>
  <defs>
    <linearGradient id="flow" x1="0" y1="0" x2="1280" y2="0" gradientUnits="userSpaceOnUse" spreadMethod="reflect">
      <stop offset="0" stop-color="#C084FC"/>
      <stop offset="0.35" stop-color="#818CF8"/>
      <stop offset="0.65" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#3B82F6"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="0 0; 1280 0; 0 0" dur="12s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="flow2" x1="0" y1="0" x2="1280" y2="0" gradientUnits="userSpaceOnUse" spreadMethod="reflect">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="0.5" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#C084FC"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="0 0; -1280 0; 0 0" dur="16s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="glow" x="-10%" y="-40%" width="120%" height="180%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="1280" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#202328"/>
      <stop offset="1" stop-color="#16181B"/>
    </linearGradient>
    <radialGradient id="glowViolet" cx="300" cy="120" r="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#C084FC" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#C084FC" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBlue" cx="1020" cy="280" r="460" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3B82F6" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="logo" x1="0" y1="23" x2="0" y2="233" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#C084FC"/>
      <stop offset="1" stop-color="#3B82F6"/>
    </linearGradient>
  </defs>
  <style>
    .b { fill: url(#flow); transform-box: fill-box; transform-origin: center; animation: beat 1.9s ease-in-out infinite; }
    /* lub-dub: two quick rises, then rest */
    @keyframes beat {
      0%, 100% { transform: scaleY(0.42); opacity: 0.75; }
      9% { transform: scaleY(1.08); opacity: 1; }
      17% { transform: scaleY(0.58); }
      25% { transform: scaleY(0.92); opacity: 1; }
      38% { transform: scaleY(0.45); opacity: 0.8; }
    }
    .s1 { animation: sway 7s linear infinite; }
    .s2 { animation: sway2 9s linear infinite; }
    @keyframes sway { from { transform: translateX(0); } to { transform: translateX(-420px); } }
    @keyframes sway2 { from { transform: translateX(-300px); } to { transform: translateX(0); } }
    @media (prefers-reduced-motion: reduce) { .b, .s1, .s2 { animation: none; } }
  </style>
  <rect width="1280" height="360" rx="24" fill="url(#ground)"/>
  <rect width="1280" height="360" rx="24" fill="url(#glowViolet)"/>
  <rect width="1280" height="360" rx="24" fill="url(#glowBlue)"/>
  <g transform="translate(458 46) scale(0.42)">
    <rect x="30" y="88" width="28" height="80" rx="14" fill="url(#logo)"/>
    <rect x="72" y="53" width="28" height="150" rx="14" fill="url(#logo)"/>
    <rect x="114" y="23" width="28" height="210" rx="14" fill="url(#logo)"/>
    <rect x="156" y="58" width="28" height="140" rx="14" fill="url(#logo)"/>
    <rect x="198" y="93" width="28" height="70" rx="14" fill="url(#logo)"/>
  </g>
  <text x="580" y="122" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="68" font-weight="700" fill="#E6E8EB">Voicer</text>
  <text x="640" y="168" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="24" fill="#A0A6AE">Speech to text and text to speech, on your own computer</text>
